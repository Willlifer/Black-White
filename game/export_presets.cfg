; D395/D396: the Windows build. Run ../build_windows.bat (or build_windows.sh),
; which exports preset 0 into ../dist/BlackWhite-<date>/ and zips it.
; Preset 1 is the same plus tests/ (`build_windows.bat tests`: a DEBUG export, then `BlackWhite.console.exe --headless -- --self-test`)
; It checks an exported pack: verification only, never ship it.
; Preset 2 is the browser build for Vercel (D492, single-threaded so no COOP/COEP headers are needed): run ../build_web.bat (or build_web.sh) -> ../web/, commit web/, push.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.csv, *.json, *.txt"
exclude_filter="tools/*, tests/test_*, tests/roster_kits.gd, art/icon/*, art/source/*, *.py, *.blend, *.md"
export_path="../dist/BlackWhite.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
